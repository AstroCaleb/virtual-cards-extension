name: Chrome Web Store status

# Run by hand from the Actions tab: shows which version is published and which is in
# review, and proves the Google sign-in still works without waiting for a release.
# Google only trusts the main branch, so run it there.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  status:
    name: Store status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: Sign in to Google
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # 3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Show the store status
        env:
          CWS_TOKEN: ${{ steps.google.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
        run: node tools/chrome-web-store.mjs status
