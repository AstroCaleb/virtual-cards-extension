name: Release

# Every push to main updates the release pull request. Merging that pull request pushes
# to main again, and that run tags the version, creates the GitHub Release, attaches the
# zip, and sends the same version to the Chrome Web Store for review. Only commits
# starting with fix: or feat: count towards a release.
on:
  push:
    branches:
      - main

# Read-only by default. Each job asks for exactly the access it needs.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      # The release pull request's number when this run opened or updated it.
      pr_number: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: Run tests
        run: node tools/capture.test.mjs

      - name: Update the release pull request, or release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # 5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The zip keeps one name across versions, so the README's
      # releases/latest/download/virtual-cards-extension.zip link never changes.
      # Its contents sit in a folder, so unzipping never scatters files.
      - name: Zip the extension
        if: ${{ steps.release.outputs.release_created }}
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          test "v$VERSION" = "$TAG" || { echo "Release $TAG but manifest.json says $VERSION"; exit 1; }
          mkdir -p dist/virtual-cards-extension
          cp -R manifest.json service-worker.js content sidepanel src icons LICENSE dist/virtual-cards-extension/
          (cd dist && zip -r -X virtual-cards-extension.zip virtual-cards-extension)

      - name: Attach the zip to the release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release upload "$TAG" dist/virtual-cards-extension.zip

  # The branch ruleset requires "Privacy check (main's rules)", but GitHub doesn't start the
  # Privacy workflow on pull requests the Actions bot opens, so the release pull request
  # would wait for it forever. This runs main's privacy check on that pull request and
  # posts the result under the same name. Only this job may post that check: a workflow
  # that runs on pull requests could use it to fake a pass for a fork.
  release-pr-privacy:
    name: Privacy check for the release pull request
    needs: release
    if: needs.release.outputs.pr_number != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: read
    steps:
      - name: Checkout main's rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          path: main
          persist-credentials: false

      - name: Find the release pull request's latest commit
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.release.outputs.pr_number }}
        run: echo "sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)" >> "$GITHUB_OUTPUT"

      - name: Checkout the release pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ steps.head.outputs.sha }}
          path: pull-request
          persist-credentials: false

      - name: Check it with main's rules, and report the result on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
        run: |
          if node main/tools/check-privacy.mjs pull-request --base main > result.txt 2>&1; then
            conclusion=success
          else
            conclusion=failure
          fi
          cat result.txt
          gh api "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name="Privacy check (main's rules)" \
            -f head_sha="$HEAD_SHA" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f "output[title]=Privacy check: $conclusion" \
            -f "output[summary]=$(grep -v '^::' result.txt | head -c 60000)" > /dev/null

  # Signs in to Google without a stored key: Google trusts this repository's main branch
  # directly (workload identity federation), so there is no secret that could leak and
  # let someone else publish an update. Skipped until the repository variables are set.
  store:
    name: Chrome Web Store
    needs: release
    if: needs.release.outputs.release_created == 'true' && vars.CWS_PUBLISHER_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      # The store wants manifest.json at the root of the zip, unlike the GitHub download.
      - name: Zip the extension for the store
        run: zip -r -X store.zip manifest.json service-worker.js content sidepanel src icons LICENSE

      - name: Sign in to Google
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # 3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Upload and submit for review
        env:
          CWS_TOKEN: ${{ steps.google.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
        run: node tools/chrome-web-store.mjs publish store.zip
