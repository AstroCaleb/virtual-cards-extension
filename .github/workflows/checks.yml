name: Checks

# Runs on every pull request, so a failing test or a broken manifest shows up before it
# can reach a release. Release pull requests come from the GitHub Actions bot, so GitHub
# holds this run until a maintainer clicks "Approve workflows to run". Skipping it is
# safe: those pull requests only bump the version, and the release job tests again.
on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Tests and manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: Run tests
        run: node tools/capture.test.mjs

      - name: Check JavaScript syntax
        run: git ls-files '*.js' '*.mjs' | xargs -n 1 node --check

      - name: Check the manifest
        run: node tools/check-manifest.mjs
